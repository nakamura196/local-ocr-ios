name: LocalOCR
options:
  bundleIdPrefix: com.nakamura196
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "Q6S8JS6GWV"
    CODE_SIGN_STYLE: "Automatic"

targets:
  LocalOCR:
    type: application
    platform: iOS
    sources:
      - path: LocalOCR
        excludes:
          - "Models/**"
      - path: LocalOCR/Models
        type: folder
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Local OCR"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "文字を読み取る資料を撮影するために使います。画像は端末の外に送りません。"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "画像を写真に保存するために使います。"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.nakamura.localocr
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "2"
        DEVELOPMENT_TEAM: "Q6S8JS6GWV"
        CODE_SIGN_STYLE: "Automatic"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
    postBuildScripts:
      - script: |
          # Fix ONNX Runtime MinimumOSVersion mismatch and re-sign (same as KotenOCR)
          FW_DIR="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/onnxruntime.framework"
          FW_PLIST="${FW_DIR}/Info.plist"
          if [ -f "$FW_PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion ${IPHONEOS_DEPLOYMENT_TARGET}" "$FW_PLIST"
            if [ "${CODE_SIGNING_ALLOWED}" != "NO" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY}" ]; then
              codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --timestamp=none --preserve-metadata=identifier,entitlements "${FW_DIR}"
            fi
          fi
        name: Fix ONNX Runtime and re-sign
        basedOnDependencyAnalysis: false
    dependencies:
      - package: onnxruntime-swift-package-manager
        product: onnxruntime

  LocalOCRTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LocalOCRTests
        excludes:
          - "Resources/**"
      - path: LocalOCRTests/Resources
        buildPhase: resources
    dependencies:
      - target: LocalOCR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nakamura.localocr.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LocalOCR.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/LocalOCR"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  LocalOCR:
    build:
      targets:
        LocalOCR: all
        LocalOCRTests: [test]
    run:
      config: Debug
    test:
      targets:
        - LocalOCRTests

packages:
  onnxruntime-swift-package-manager:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: "1.24.2"
